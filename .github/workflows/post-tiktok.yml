name: 2. Tự Động Đăng TikTok (Lên Lịch hoặc Bấm Nút)

on:
  # KHÔNG dùng "schedule:" nội bộ của GitHub nữa — đã xác nhận thực tế nó có thể BỎ LỠ HẲN cả một
  # khung giờ khi hệ thống GitHub quá tải (không chỉ trễ vài phút/giờ như trước, mà có thể không
  # chạy một lần nào trong suốt cửa sổ 20 phút đã cấu hình). Thay vào đó, dùng workflow_dispatch với
  # input "mode" — một dịch vụ cron ngoài (ví dụ cron-job.org) gọi thẳng API GitHub đúng giờ VN với
  # mode=scheduled để chạy qua src/tiktok-scheduler.js (có kiểm tra khung giờ + chống đăng lặp).
  workflow_dispatch:
    inputs:
      mode:
        description: 'scheduled = qua tiktok-scheduler.js (tự kiểm tra khung giờ) | manual = đăng ngay'
        required: false
        default: 'manual'

permissions:
  contents: write # Cần quyền ghi để commit lại file trạng thái khung giờ đã đăng (khi mode=scheduled)

jobs:
  post-tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --omit=dev

      - name: Post Next Video to TikTok (mode=scheduled kiểm tra khung giờ, manual đăng ngay)
        env:
          SHEET_DOCUMENT_ID: ${{ secrets.SHEET_DOCUMENT_ID }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}
          FLOW_PROJECT_ID: ${{ secrets.FLOW_PROJECT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TIKTOK_SESSION_JSON: ${{ secrets.TIKTOK_SESSION_JSON }}
          TIKTOK_PROXY_URL: ${{ secrets.TIKTOK_PROXY_URL }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "scheduled" ]; then
            node src/tiktok-scheduler.js
          else
            node src/index.js --post-tiktok
          fi

      - name: Lưu lại trạng thái khung giờ đã đăng (chỉ khi mode=scheduled)
        if: github.event.inputs.mode == 'scheduled'
        run: |
          if [ -n "$(git status --porcelain .tiktok-schedule-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .tiktok-schedule-state.json
            git commit -m "chore: cập nhật trạng thái khung giờ đăng TikTok [skip ci]"
            git push
          else
            echo "Không có thay đổi trạng thái để lưu."
          fi
