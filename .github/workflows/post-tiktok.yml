name: 2. Tự Động Đăng TikTok (Lên Lịch hoặc Bấm Nút)

on:
  # Lịch tự động đăng 2 lần/ngày ĐÃ TẮT theo yêu cầu — chỉ còn đăng bằng tay qua workflow_dispatch.
  # Muốn bật lại: bỏ comment 2 dòng dưới.
  # schedule:
  #   # Giờ VN: 11:30 trưa & 19:30 tối | 11:30 VN = 04:30 UTC | 19:30 VN = 12:30 UTC
  #   - cron: '30 4,12 * * *'
  workflow_dispatch: # Nút bấm để bạn đăng ngay lập tức bằng tay bất cứ lúc nào

jobs:
  post-tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --omit=dev

      - name: Post Next Video to TikTok
        env:
          SHEET_DOCUMENT_ID: ${{ secrets.SHEET_DOCUMENT_ID }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}
          FLOW_PROJECT_ID: ${{ secrets.FLOW_PROJECT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TIKTOK_SESSION_JSON: ${{ secrets.TIKTOK_SESSION_JSON }}
          TIKTOK_AUTO_PUBLISH: 'true'
          TIKTOK_PROXY_URL: ${{ secrets.TIKTOK_PROXY_URL }}
        run: node src/index.js --post-tiktok
