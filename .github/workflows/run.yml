name: Video Generator & TikTok Auto-Poster

on:
  schedule:
    # Chạy định kỳ mỗi 30 phút (tự động quét Sheet, tải video Drive & đăng TikTok)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" bằng tay bất cứ lúc nào trên GitHub

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Dependencies
        run: npm install --omit=dev

      - name: Run Worker & Post TikTok
        env:
          SHEET_DOCUMENT_ID: ${{ secrets.SHEET_DOCUMENT_ID }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}
          FLOW_PROJECT_ID: ${{ secrets.FLOW_PROJECT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TIKTOK_SESSION_JSON: ${{ secrets.TIKTOK_SESSION_JSON }}
          TIKTOK_AUTO_PUBLISH: 'true'
          TIKTOK_PROXY_URL: ${{ secrets.TIKTOK_PROXY_URL }}
          ENGINE: ${{ secrets.ENGINE || 'vids' }}
        run: node src/index.js
